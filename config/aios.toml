# "fake" runs the scripted FakeAgent; "real" calls the [ai] endpoint.
agent = "fake"

[ai]
endpoint    = "http://127.0.0.1:8080/v1"   # OpenAI-compatible API; any IP:port or cloud URL
model       = "REPLACE_ME"
api_key_env = "AIOS_API_KEY"               # name of env var; never store the key in the file
timeout_ms  = 30000

[paths]
socket   = "/run/aios/aiosd.sock"          # dev: $XDG_RUNTIME_DIR/aios/aiosd.sock
audit    = "/var/lib/aios/audit.log"
notes    = "/var/lib/aios/notes"
read_roots = ["/var/lib/aios/user"]        # fs.read is limited to these
shell    = "/usr/share/aios/shell"         # static files served to the webview

[policy]
default = "ask"

[shell]
listen = "127.0.0.1:7700"                  # loopback only; anything else is rejected
