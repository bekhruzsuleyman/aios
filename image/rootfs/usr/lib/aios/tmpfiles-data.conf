# Applied by aiosd.service once the data partition is mounted.
d /var/lib/aios 0755 aiosd aiosd -
# Notes: written by aiosd, readable and editable by the desktop user.
d /var/lib/aios/notes 2775 aiosd aios -
# The user's files: fs.read is limited to this directory.
d /var/lib/aios/user 2775 aios aios -
# A model put here replaces the built-in AI's (see /usr/lib/aios/aios-llm).
d /var/lib/aios/models 0755 root root -
# The user's folders, which every app sees in its home (actions::launch).
d /var/lib/aios/user/Desktop 2775 aios aios -
d /var/lib/aios/user/Documents 2775 aios aios -
d /var/lib/aios/user/Downloads 2775 aios aios -
d /var/lib/aios/user/Music 2775 aios aios -
d /var/lib/aios/user/Pictures 2775 aios aios -
d /var/lib/aios/user/Videos 2775 aios aios -
