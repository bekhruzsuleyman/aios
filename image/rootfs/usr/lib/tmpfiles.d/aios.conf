# Runtime directories on the tmpfs /home and /var (root is read-only).
d /home/aios 0700 aios aios -
# Agent sockets: aiosd owns the directory; the setgid bit gives every
# socket in it group aios, so the shell (and only the desktop user) can
# connect. Launched apps never see it (bubblewrap mounts an empty /run).
d /run/aios 2770 aiosd aios -
# Keep the journal on the data partition so logs survive a reboot and can
# be read from another machine (journalctl -D <mount>/journal).
d /var/lib/aios/journal 2755 root systemd-journal -
L /var/log/journal - - - - /var/lib/aios/journal
