# AiOS root filesystem. Built by scripts/20-rootfs.sh into build/rootfs/,
# then packed read-only as erofs. Ubuntu instead of Debian: see DECISIONS.md T3.
[Distribution]
Distribution=ubuntu
Release=noble
Repositories=main,universe
Mirror=https://archive.ubuntu.com/ubuntu

[Output]
Format=directory
Output=rootfs
ManifestFormat=json

[Content]
Bootable=no
WithDocs=no
CleanPackageMetadata=yes
Hostname=aios
MachineId=a105a105a105a105a105a105a105a105
Packages=
    systemd
    systemd-sysv
    systemd-resolved
    dbus
    libpam-systemd
    udev
    seatd
    labwc
    foot
    epiphany-browser
    mousepad
    bubblewrap
    iwd
    pipewire
    wireplumber
    pipewire-pulse
    fonts-inter
    fonts-dejavu-core
    ca-certificates
    libinput-bin
    xkb-data
    passwd
    login
    util-linux
    iproute2
    procps
    kmod
PostInstallationScripts=mkosi.postinst
RemoveFiles=
    /var/cache/apt
    /var/lib/apt/lists
    /usr/share/man
    /usr/share/doc
