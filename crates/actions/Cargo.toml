[package]
name = "actions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt", "net", "io-util", "time", "macros", "fs"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros"] }
