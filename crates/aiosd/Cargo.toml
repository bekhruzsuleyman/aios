[package]
name = "aiosd"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
protocol = { version = "0.1.0", path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
toml = "1.1.8"
tracer = { version = "0.1.0", path = "../tracer" }
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
uuid = { version = "1.28.0", features = ["v4"] }
