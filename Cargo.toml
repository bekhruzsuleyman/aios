[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/tracer",
    "crates/client",
    "crates/broker",
    "crates/actions",
    "crates/aiosd",
    "crates/shell",
    "tests/testkit",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 4
